# Publish to PyPI when a version tag is pushed.
#
# No token lives anywhere. PyPI verifies the job over OIDC through Trusted Publishing,
# configured once at https://pypi.org/manage/account/publishing/ with:
#   project: mitmcloak   owner: sardanioss   repo: mitmcloak
#   workflow: publish.yaml   environment: pypi
#
# The extension matters: PyPI matches the workflow file by name, so publish.yaml and
# publish.yml are different publishers and one of them will not be found.
#
# One job on purpose. Splitting build from publish means handing the distributions
# between them through upload-artifact/download-artifact, and those two have to be kept
# on matching majors; a release is the worst moment to discover they are not.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine

      # The tag has to agree with the version in the package. Without this you can ship
      # v0.1.1 from a tree that still says 0.1.0, and PyPI never lets you reuse a number.
      - name: tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  packaged=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match version $pkg"; exit 1; }

      - run: python -m build

      # Catches the metadata problems PyPI rejects an upload for, before the upload.
      - run: python -m twine check --strict dist/*

      - run: python -m pip install dist/*.whl
      - name: the wheel imports and registers its options
        run: |
          cd "$RUNNER_TEMP"
          python -c "import mitmcloak, json, pathlib; print('version', mitmcloak.__version__)"
          python -m mitmcloak path

      - uses: pypa/gh-action-pypi-publish@release/v1
