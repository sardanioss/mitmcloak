# Publish to PyPI when a version tag is pushed.
#
# No token lives anywhere. PyPI verifies the job with OIDC through Trusted Publishing,
# which has to be configured once at
#   https://pypi.org/manage/account/publishing/
# For a project that does not exist on PyPI yet, add a *pending* publisher there with:
#   project: mitmcloak   owner: sardanioss   repo: mitmcloak
#   workflow: publish.yml   environment: pypi
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # Catches the metadata problems PyPI rejects an upload for, before the upload.
      - run: python -m twine check --strict dist/*
      # The tag has to agree with the version in the package, or you ship v0.1.1
      # from a tree that still says 0.1.0 and cannot take it back.
      - name: tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag packaged=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != version $pkg"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
