[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitmcloak"
version = "0.1.0"
description = "Give mitmproxy's upstream leg a real browser's TLS and HTTP/2 fingerprint"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mitmproxy", "tls", "fingerprint", "ja3", "ja4", "http2", "addon", "proxy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security",
]
dependencies = [
  "mitmproxy>=11",
  # Mirroring needs tls.raw_client_hello (1.7.0). 1.7.1 adds three things nothing else
  # can supply: exact_headers on the async path, per-request header order, and response
  # trailers. It also permutes a captured hello per handshake rather than per seed,
  # which is what makes a mirrored browser's JA3 rotate the way the real one does.
  "httpcloak>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/sardanioss/mitmcloak"
Issues = "https://github.com/sardanioss/mitmcloak/issues"

[tool.setuptools]
packages = ["mitmcloak"]

[tool.setuptools.package-data]
mitmcloak = ["data/*.json"]
